<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>TCC 수입원가계산기</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f4f5; color: #18181b;
         font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  .card { background: #fff; border: 1px solid #e4e4e7; border-radius: 16px; padding: 32px; max-width: 380px; text-align: center; }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: #0f766e; color: #fff; display: grid; place-items: center; font-weight: 700; margin: 0 auto 16px; }
  h1 { font-size: 18px; margin: 0 0 8px; } p { font-size: 13.5px; color: #52525b; line-height: 1.6; margin: 0 0 20px; }
  button { height: 40px; padding: 0 20px; border-radius: 9px; border: 0; background: #0f766e; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">TC</div>
    <h1>서버에 연결할 수 없습니다</h1>
    <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요.<br>TCC는 온라인에서 데이터를 저장합니다.</p>
    <button onclick="location.href = new URLSearchParams(location.search).get('retry') || 'about:blank'">다시 시도</button>
  </div>
</body>
</html>
